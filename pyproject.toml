[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "behind-the-cloud"
version = "1.0.0"
description = "Discover the origin server hiding behind Cloudflare."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wasim Patel" }]
keywords = ["cloudflare", "origin", "recon", "bugbounty", "pentest", "security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "dnspython>=2.4",
    "mmh3>=4.0",
    "cryptography>=41.0",
]

[project.scripts]
behindthecloud = "behindthecloud.cli:main"
btcloud = "behindthecloud.cli:main"

[tool.setuptools.packages.find]
include = ["behindthecloud*"]

[tool.setuptools.package-data]
behindthecloud = ["data/*.txt"]
